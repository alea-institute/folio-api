[project]
name = "folio-api"
version = "0.4.0"
description = "API for FOLIO - the Federated Open Legal Information Ontology"
authors = [{ name = "ALEA Institute", email = "hello@aleainstitute.ai" }]
requires-python = ">=3.13,<4.0.0"
readme = "README.md"
license = "MIT"
dependencies = [
    "folio-python[search]>=0.4.1",
    "fastapi>=0.112.2",
    "uvicorn>=0.30.6",
    "jinja2>=3.1.6",
    "folio-mcp>=0.4.3",
    "limits>=3.13,<6",
]

[project.urls]
Homepage = "https://folio.openlegalstandard.org"
Repository = "https://github.com/alea-institute/folio-api"

[dependency-groups]
dev = [
    "sphinx>=7.4.7,<8",
    "black>=24.4.2,<25",
    "myst-parser>=3.0.1,<4",
    "sphinx-book-theme>=1.1.3,<2",
    "sphinxcontrib-mermaid>=0.9.2,<0.10",
    "pytest>=8.3.1,<9",
    "pytest-asyncio>=0.23.8,<0.24",
    "pytest-cov>=5.0.0,<6",
    "pylint>=3.2.7,<4",
]

[tool.hatch.build.targets.sdist]
include = ["folio_api"]

[tool.hatch.build.targets.wheel]
include = ["folio_api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pylint]
max-line-length = 120
disable = [
    "line-too-long",
    "too-few-public-methods",
    "no-self-argument",
    "cyclic-import"
]
ignore-patterns = ["test_.*?.py", "conftest.py"]

[tool.pylint.messages_control]
max-args = 10
max-attributes = 15
max-branches = 15
max-locals = 25
min-public-methods = 0

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
addopts = "--cov=folio_api --cov-report=term-missing --cov-report=xml"

[tool.uv.sources]
# folio-python 0.4.1 (bounded search caches, alea-institute/folio-python@1b4fb34)
# is tagged on GitHub but not on PyPI. Pinned to the v0.4.1 tag's commit
# archive (no git needed in the image). Drop this once 0.4.1+ is on PyPI.
# To try another folio-python build (e.g. one with a `kaos` extra), change this
# URL to that commit's archive, add the extra to the dependency above, and run
# `uv lock` (see docs in the PR description).
folio-python = { url = "https://github.com/alea-institute/folio-python/archive/35814e6e405c3a17d7a2240d8ea0efe7b4179461.tar.gz" }
# folio-mcp 0.4.3 (shared-backend + event-loop fixes) is not on PyPI yet.
# Pinned to the merge commit's GitHub archive (no git needed in the image).
# Drop this once 0.4.3 is published.
folio-mcp = { url = "https://github.com/alea-institute/folio-mcp/archive/b9e48d25f13d106080484a675d4800ad067b269e.tar.gz" }
