[project]
name = "folio-api"
version = "0.4.0"
description = "API for FOLIO - the Federated Open Legal Information Ontology"
authors = [{ name = "ALEA Institute", email = "hello@aleainstitute.ai" }]
requires-python = ">=3.13,<4.0.0"
readme = "README.md"
license = "MIT"
dependencies = [
    "folio-python[search,kaos]>=0.4.1",
    "fastapi>=0.112.2",
    "uvicorn>=0.30.6",
    "jinja2>=3.1.6",
    "folio-mcp>=0.4.3",
    "limits>=3.13,<6",
]

[project.urls]
Homepage = "https://folio.openlegalstandard.org"
Repository = "https://github.com/alea-institute/folio-api"

[dependency-groups]
dev = [
    "sphinx>=7.4.7,<8",
    "black>=24.4.2,<25",
    "myst-parser>=3.0.1,<4",
    "sphinx-book-theme>=1.1.3,<2",
    "sphinxcontrib-mermaid>=0.9.2,<0.10",
    "pytest>=8.3.1,<9",
    "pytest-asyncio>=0.23.8,<0.24",
    "pytest-cov>=5.0.0,<6",
    "pylint>=3.2.7,<4",
]

[tool.hatch.build.targets.sdist]
include = ["folio_api"]

[tool.hatch.build.targets.wheel]
include = ["folio_api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pylint]
max-line-length = 120
disable = [
    "line-too-long",
    "too-few-public-methods",
    "no-self-argument",
    "cyclic-import"
]
ignore-patterns = ["test_.*?.py", "conftest.py"]

[tool.pylint.messages_control]
max-args = 10
max-attributes = 15
max-branches = 15
max-locals = 25
min-public-methods = 0

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
addopts = "--cov=folio_api --cov-report=term-missing --cov-report=xml"

[tool.uv.sources]
# folio-python is pinned to main at the merge of alea-institute/folio-python#29
# (53b51c4: v0.4.1 + #28 kaos search + #29 LLM query expansion): bounded search caches plus the optional
# `kaos` extra (kaos-nlp-core BM25 label/definition search, Python >= 3.13).
# Neither is on PyPI yet; the commit archive needs no git in the image.
# Set FOLIO_SEARCH_BACKEND=rapidfuzz to force the old RapidFuzz search path.
# Plain v0.4.1 (no kaos): use .../archive/35814e6e405c3a17d7a2240d8ea0efe7b4179461.tar.gz
# and drop `kaos` from the extras above, then `uv lock`.
folio-python = { url = "https://github.com/alea-institute/folio-python/archive/53b51c49717b0ebeade4d255db7b75fbb7737fe9.tar.gz" }
# folio-mcp main at the merge of alea-institute/folio-mcp#8 (b6a3086): 0.4.3
# shared-backend fixes + #5 cancellation + #6 demo hardening + #9 short-ID
# self-exclusion + #8 search_expanded tool. Not on PyPI; drop once released.
folio-mcp = { url = "https://github.com/alea-institute/folio-mcp/archive/b6a3086672863ae99df23587367631aa3aabde3b.tar.gz" }
